name: YouGlitch SMP 1024 - Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project root
        id: locate
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $cmakeFiles = @(Get-ChildItem -LiteralPath $workspace -Filter 'CMakeLists.txt' -File -Recurse)
          $projectRoots = @()

          foreach ($cmakeFile in $cmakeFiles) {
            $candidate = $cmakeFile.DirectoryName
            $processorCpp = Join-Path $candidate 'Source/PluginProcessor.cpp'
            $processorH = Join-Path $candidate 'Source/PluginProcessor.h'
            $editorCpp = Join-Path $candidate 'Source/PluginEditor.cpp'

            $hasProcessorCpp = Test-Path -LiteralPath $processorCpp -PathType Leaf
            $hasProcessorH = Test-Path -LiteralPath $processorH -PathType Leaf
            $hasEditorCpp = Test-Path -LiteralPath $editorCpp -PathType Leaf

            if ($hasProcessorCpp -and $hasProcessorH -and $hasEditorCpp) {
              $projectRoots += $candidate
            }
          }

          if ($projectRoots.Count -ne 1) {
            Write-Host 'Project roots detected:'
            foreach ($candidate in $projectRoots) { Write-Host $candidate }
            throw "Expected exactly one project root; found $($projectRoots.Count)."
          }

          $root = $projectRoots[0]
          "project_root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Project root: $root"
          Get-ChildItem -LiteralPath $root -Force | Format-Table Name, Mode

      - name: Configure CMake and fetch JUCE
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
        run: |
          cmake --version
          $buildDir = Join-Path $env:PROJECT_ROOT 'build'
          cmake -S $env:PROJECT_ROOT -B $buildDir -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Standalone
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
        run: |
          $buildDir = Join-Path $env:PROJECT_ROOT 'build'
          cmake --build $buildDir --config Release --target YouGlitchSMP1024_Standalone --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
        run: |
          $buildDir = Join-Path $env:PROJECT_ROOT 'build'
          cmake --build $buildDir --config Release --target YouGlitchSMP1024_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect deliverables and debug symbols
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
        run: |
          $buildDir = Join-Path $env:PROJECT_ROOT 'build'
          $outDir = Join-Path $env:PROJECT_ROOT 'deliverables'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exeCandidates = @(Get-ChildItem -LiteralPath $buildDir -Filter 'YouGlitch SMP 1024.exe' -File -Recurse)
          if ($exeCandidates.Count -eq 0) {
            throw 'Standalone executable was not found after the build.'
          }
          $exe = $exeCandidates[0]
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $outDir $exe.Name) -Force

          $vstCandidates = @(Get-ChildItem -LiteralPath $buildDir -Directory -Filter '*.vst3' -Recurse)
          foreach ($vst in $vstCandidates) {
            $destination = Join-Path $outDir $vst.Name
            if (Test-Path -LiteralPath $destination) {
              Remove-Item -LiteralPath $destination -Recurse -Force
            }
            Copy-Item -LiteralPath $vst.FullName -Destination $destination -Recurse -Force
          }

          $pdbFiles = @(Get-ChildItem -LiteralPath $buildDir -Filter '*.pdb' -File -Recurse)
          foreach ($pdb in $pdbFiles) {
            Copy-Item -LiteralPath $pdb.FullName -Destination $outDir -Force
          }

          Get-ChildItem -LiteralPath $outDir -Force | Format-Table Name, Length
          if (-not (Test-Path -LiteralPath (Join-Path $outDir 'YouGlitch SMP 1024.exe') -PathType Leaf)) {
            throw 'Standalone executable was not collected.'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: YouGlitch-SMP-1024-Windows-x64-Diagnostic
          path: ${{ steps.locate.outputs.project_root }}/deliverables/**
          if-no-files-found: error
          retention-days: 14
